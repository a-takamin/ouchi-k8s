apiVersion: v1
kind: Secret
metadata:
  name: todo-list-secret
  namespace: todo-list
stringData:
  # 左のキー = container の環境変数名（env.ts が読む大文字に合わせる）
  # 右の ${VAR} = apply マシン側の環境変数（envsubst で展開してから apply する）
  SES_REGION: ${SES_REGION}
  SES_FROM_ADDRESS: ${SES_FROM_ADDRESS}
  SES_TO_ADDRESS: ${SES_TO_ADDRESS}
  # SES 送信に必要な AWS 認証情報
  # TODO: 今は良いが IAM アクセスキーを使いたくない
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
